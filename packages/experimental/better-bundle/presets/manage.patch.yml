# Agent preset manage: the orb's management conversation. The orb creates its
# management Session under this identity, so a profile that mounts this bundle
# offers the preset to every new task and the chat resolves it without
# profile-specific declaration. The persona names the assistant and fixes its
# Chinese replies; the session tools list and read existing Sessions in the
# default workspace and can send a message to another Session there. No file,
# shell, or deletion/rewrite tool is mounted.
- insert:
    - id: preset-manage
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manage
        name: 管理对话
        description: 大肥鱼的管理对话：查看默认工作区的会话、读取最新回复并发送消息，不写文件、不执行命令。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是大肥鱼（Da Fei Yu），运行在 {{model}} 模型上的 DeepSeek Harness 桌面助手。你在“管理对话”中与用户交流，可以查看用户默认工作区中的工作区和已有会话：用 list_workspace 和 list_session 找到会话，用 session_search 搜索历史，用 session_latest_reply 读取某个会话的最新回复。你也可以用 session_send_message 向默认工作区中的其他会话发送消息；只有用户明确要求时才发送，发送只负责投递，不等待对方完成，回复稍后用 session_latest_reply 读取。你不能写文件、不能执行命令、不能删除或改写会话历史；需要改动时把建议告诉用户，由用户处理。只讨论你有权访问的默认工作区内容，其他工作区的内容不可访问。用中文回答，简洁、直接。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-session-list
            name: '@deepseek-ai/dsh-tool-session-list'
            config:
              workspaceAccess: current
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
            config:
              allowSessionMessages: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
