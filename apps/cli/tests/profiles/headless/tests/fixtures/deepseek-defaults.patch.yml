# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # Keep-alive comments are the only SSE activity before the first event. The
    # snapshot server writes them for longer than this deadline, so a provider
    # that ignored comments would idle out and retry, while the deadline stays
    # far above the heartbeat cadence and CI scheduling jitter.
    streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
